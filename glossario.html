<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./src/icons/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./src/css/root.css">
    <link rel="stylesheet" href="./src/css/header.css">
    <link rel="stylesheet" href="./src/css/footer.css">
    <link rel="stylesheet" href="./src/css/glossario.css">
    <title>Glossário Tech | Trilha Tech</title>
</head>

<body data-page="glossario">
    <div class="app-container">
        <main>
            <section class="glossario-hero">
                <div class="container hero-glossario-container">
                    <div class="glossario-header-text">
                        <h1>Dicionário <span class="text-highlight">Tech</span></h1>
                        <p>A tecnologia tem seu próprio idioma. Aqui você encontra as palavras mais usadas na área de TI
                            traduzidas de forma simples para não ficar perdido nas conversas.</p>
                    </div>
                </div>
            </section>

            <section class="glossario-filtros">
                <div class="container">
                    <div class="search-box-container brutal-card-flat">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Busque por um termo tech, ex: Back-end">
                        <button id="clearSearchBtn" class="btn-limpar" style="display: none;" aria-label="Limpar busca">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <div class="alfabeto-container" id="alfabetoContainer"></div>
                </div>
            </section>

            <section class="glossario-resultados">
                <div class="container">
                    <div id="noResultsMessage" class="no-results" style="display: none;">
                        <h3>Nenhum termo encontrado</h3>
                        <p>Tente buscar por outra palavra ou limpe os filtros.</p>
                    </div>

                    <div class="glossario-grid" id="glossarioGrid"></div>
                </div>
            </section>
        </main>
    </div>

    <script defer src="./src/js/app.js"></script>
    <script defer src="./src/js/glossario.js"></script>
    <script defer src="./src/js/scrollbar.js"></script>
</body>

</html>
